<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fellowship42</title>
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Resolve the theme before first paint. Without this, an operator who
      // works in dark mode gets a full-brightness white flash on every load.
      // Mirrors applyThemeMode() in src/lib/theme-mode.tsx.
      ;(function () {
        try {
          var stored = localStorage.getItem('f42.theme')
          var mode = stored === 'light' || stored === 'dark' ? stored : null
          var dark =
            mode === 'dark' ||
            (mode === null &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (error) {
          // No storage available — the default light theme is correct.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
