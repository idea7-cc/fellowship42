version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      # Majors arrive as their own pull requests so one blocked upgrade
      # doesn't hold back the rest of the tooling.
      development-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # typescript-eslint supports TypeScript < 6.1; revisit when it widens.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      # @cloudflare/vitest-pool-workers needs vitest ^4.1. It is renamed
      # @cloudflare/vitest-plugin; move to that before taking vitest 5.
      - dependency-name: vitest
        update-types:
          - version-update:semver-major
      # Deprecated in favour of @cloudflare/vitest-plugin (see above).
      - dependency-name: '@cloudflare/vitest-pool-workers'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
